name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build and test
        run: npm test
      - name: Check docs/tools.md is up to date
        run: npm run docs:check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: unifi-mcp:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e UNIFI_URL=https://192.0.2.1 -e UNIFI_API_KEY=ci -e MCP_AUTH_TOKEN=ci \
            unifi-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          echo
          tools=$(curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq '.result.tools | length')
          echo "Tools registered: $tools"
          test "$tools" -gt 0
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -d '{}')
          test "$code" = 401
          docker logs smoke
          docker rm -f smoke

      - name: Build all platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
