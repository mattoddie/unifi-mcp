name: 📡 Compatibility report
description: Tell us how unifi-mcp works with your hardware and UniFi Network version, good or bad.
labels: [compatibility]
body:
  - type: input
    id: controller
    attributes:
      label: Controller / console model
      placeholder: e.g. UDM SE, Cloud Key Gen2 Plus, self-hosted on Debian
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: UniFi OS and Network versions
      placeholder: e.g. UniFi OS 4.3.6, Network 9.3.45
    validations:
      required: true
  - type: input
    id: unifi-mcp
    attributes:
      label: unifi-mcp version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Everything I tried worked
        - Mostly works, some tools fail
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which tools worked or failed, and any error messages. Remove private details.
